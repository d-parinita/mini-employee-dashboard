<ng-container>
    <div class="navbar bg-base-100 shadow-sm">
        <div class="flex-1">
            <a class="ml-4 text-xl">Dashboard</a>
        </div>
        <div class="flex-none">
            <div class="dropdown dropdown-end">
                <div tabindex="0" role="button" class="btn btn-ghost btn-circle mr-2">
                    <div class="indicator">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>                    
                    </div>
                </div>
            </div>
            <div class="dropdown dropdown-end">
                <label class="swap swap-rotate mr-4">
                    <input type="checkbox" class="theme-controller" value="dark" />
                    <img class="swap-off h-7 w-7 fill-current" height="30px" width="30px" src="../../../assets/images/sun.svg">
                    <img class="swap-on h-7 w-7" height="30px" width="30px" src="../../../assets/images/moon.svg">
                </label>
            </div>
        </div>
    </div>
</ng-container>
