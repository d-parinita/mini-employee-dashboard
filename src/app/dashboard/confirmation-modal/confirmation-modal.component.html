<dialog #deleteModal id="my_modal_1" class="modal">
  <div class="modal-box">
    <h3 class="text-lg font-bold">Delete Confirmation</h3>
    <p class="py-4">Are you sure you want to delete this employee?</p>
    <div class="modal-action">
      <button (click)="handleDeleteEmployee()" class="btn btn-error text-white btn-sm">Delete</button>  
      <form method="dialog">
        <button class="btn btn-sm">Close</button>
      </form>
    </div>
  </div>
</dialog>
