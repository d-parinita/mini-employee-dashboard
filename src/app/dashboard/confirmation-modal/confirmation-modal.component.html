<dialog #confirmModal id="my_modal_1" class="modal">
  <div class="modal-box">
    <h3 class="text-lg font-bold">{{conFirmTitle}}</h3>
    <p class="py-4">{{conFirmText}}</p>
    <div class="modal-action">
      <button (click)="handleConfirmEmployee()" class="btn btn-error text-white btn-sm">{{btnText}}</button>  
      <form method="dialog">
        <button class="btn btn-sm">Close</button>
      </form>
    </div>
  </div>
</dialog>
